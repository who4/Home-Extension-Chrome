<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="style.css">
    <!-- SF Pro Font (System) used via CSS, no external link needed -->
</head>

<body>
    <main>
        <!-- Sticky Notes Container -->
        <div id="notes-container"></div>

        <div id="clock-container" class="clock-container">
            <div id="time-display">00:00</div>
            <div id="date-display">Monday, Jan 1</div>
        </div>

        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search" autocomplete="off">
            <div id="search-suggestions" class="suggestions-container"></div>
        </div>

        <div class="shortcuts-grid" id="shortcuts-grid">
            <!-- Shortcuts injected here -->
            <div class="add-shortcut-btn" id="add-shortcut-trigger">+</div>
        </div>
    </main>

    <!-- Add Note Button -->
    <button id="add-note-btn" class="add-note-btn" title="New Sticky Note">+</button>

    <!-- Settings Button -->
    <button id="settings-btn" class="settings-gear" title="Settings" aria-label="Settings">⚙</button>

    <!-- Price Widget -->
    <div class="price-widget" id="price-widget">
        <div class="price-row">
            <span class="price-name">USD</span>
            <span class="price-value" id="price-usd">Loading...</span>
        </div>
        <div class="price-row">
            <span class="price-name">GOLD</span>
            <span class="price-value" id="price-gold">Loading...</span>
        </div>
    </div>

    <!-- News Widget -->
    <a href="#" class="news-widget" id="news-widget" target="_blank">
        <span class="news-label">BREAKING 🔴</span>
        <span class="news-headline" id="news-headline">Loading top story...</span>
    </a>



    <!-- Add Shortcut Modal -->
    <div class="modal" id="shortcut-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add Shortcut</h2>
                <button class="close-btn" id="close-modal">&times;</button>
            </div>
            <div class="form-group">
                <label for="shortcut-title">Name</label>
                <input type="text" id="shortcut-title" placeholder="YouTube">
            </div>
            <div class="form-group">
                <label for="shortcut-url">Address</label>
                <input type="text" id="shortcut-url" placeholder="youtube.com">
                <div id="icon-results"></div> <!-- Preview container -->
            </div>
            <button class="primary-btn" id="save-shortcut">Add to Home</button>
        </div>
    </div>

    <!-- Settings Modal (New) -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="close-btn" id="close-settings">&times;</button>
            </div>
            <div class="form-group">
                <label>Appearance</label>
                <div style="font-size: 14px; color: #888;">
                    This extension is designed with a native Apple feel. Customization options coming soon.
                </div>
            </div>
            <div class="form-group">
                <label>Data Source</label>
                <div style="font-size: 14px; color: #888;">
                    Prices provided by TGJU / BRS (Fallback).
                </div>
            </div>
            <div class="form-group">
                <button class="primary-btn" id="reload-extension" style="background: #333; margin-top: 10px;">Reload
                    Extension</button>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="script.js"></script>
</body>

</html>
